<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- BeSpoke Afrika — "Circle & Seedling" mark -->
  <!-- Field green #3D6B52 x5, Harvest gold #C98A2E x1 (the emerging idea) -->
  <g transform="rotate(0 50 50)"><ellipse cx="50" cy="23" rx="7.5" ry="16" fill="#C98A2E"/></g>
  <g transform="rotate(60 50 50)"><ellipse cx="50" cy="23" rx="7.5" ry="16" fill="#3D6B52"/></g>
  <g transform="rotate(120 50 50)"><ellipse cx="50" cy="23" rx="7.5" ry="16" fill="#3D6B52"/></g>
  <g transform="rotate(180 50 50)"><ellipse cx="50" cy="23" rx="7.5" ry="16" fill="#3D6B52"/></g>
  <g transform="rotate(240 50 50)"><ellipse cx="50" cy="23" rx="7.5" ry="16" fill="#3D6B52"/></g>
  <g transform="rotate(300 50 50)"><ellipse cx="50" cy="23" rx="7.5" ry="16" fill="#3D6B52"/></g>
</svg>
